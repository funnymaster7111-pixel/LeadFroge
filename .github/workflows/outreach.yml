name: Cold email outreach

on:
  schedule:
    # Weekdays around 9:30am Chicago time (GitHub schedules run in UTC).
    - cron: "37 14 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: outreach
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s outreach -p "test_*.py"

      - name: Run outreach
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python outreach/autosender.py

      - name: Save progress
        if: always()
        run: |
          git config user.name "leadforge-outreach-bot"
          git config user.email "actions@users.noreply.github.com"
          git add outreach/state.json outreach/log.csv outreach/suppressed.txt outreach/previews 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to save."
          else
            git commit -m "Outreach run $(date -u +%F)"
            git pull --rebase
            git push
          fi
