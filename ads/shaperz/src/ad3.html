<!doctype html><html><head><meta charset="utf-8"><title>Shaperz Ad 3 – Patient Testimonial</title>
<link rel="stylesheet" href="brand.css">
<style>
.card{position:relative;margin-top:0;width:100%;flex:1;background:#fff;border:1.5px solid var(--gold);border-radius:6px;
  padding:44px 70px 36px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 18px 40px rgba(31,59,87,.08)}
.q{font-family:var(--serif);font-weight:700;font-size:200px;line-height:.6;color:var(--pink);height:84px}
blockquote{font-family:var(--sans);font-weight:500;font-size:42px;line-height:1.3;color:var(--navy);margin-top:18px}
.who{margin-top:30px;font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:2px}
.stars{display:flex;gap:8px;margin-top:16px}
.stars svg{width:38px;height:38px}
.offer{margin-top:26px;font-size:24px;font-weight:600;letter-spacing:3px;text-transform:uppercase}
.offer b{color:var(--pink);font-weight:800}
.tagline{font-size:46px;margin-top:18px}
.card .logo{margin-top:26px}
@media (max-aspect-ratio:3/4){
  .card{margin-top:0;padding:90px 64px 70px}
  .q{font-size:280px;height:120px}
  blockquote{font-size:62px;margin-top:30px}
  .who{font-size:34px;margin-top:50px}
  .stars svg{width:52px;height:52px}
  .offer{font-size:32px;margin-top:50px}
  .tagline{font-size:66px;margin-top:36px}
}
</style></head><body>
<div class="ad">
  <div class="card">
    <div class="q">&ldquo;</div>
    <blockquote>[Patient quote goes here — from a real Shaperz Google review]</blockquote>
    <div class="who">– [Patient Name], Chicago</div>
    <div class="stars" aria-label="5 stars"><svg viewBox="0 0 24 24"><path fill="#B8954F" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg><svg viewBox="0 0 24 24"><path fill="#B8954F" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg><svg viewBox="0 0 24 24"><path fill="#B8954F" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg><svg viewBox="0 0 24 24"><path fill="#B8954F" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg><svg viewBox="0 0 24 24"><path fill="#B8954F" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg></div>
    <div class="logo"><img src="assets/shaperz-logo.png" alt="Shaperz Elite Wellness and Aesthetics"></div>
  </div>
  <div class="offer">New patients · <b>$249</b> first month</div>
  <div class="tagline">Get ready, get set, get healthy</div>
</div>
<script src="logo.js"></script>
</body></html>
