<!doctype html><html><head><meta charset="utf-8"><title>Shaperz Ad 3 – Patient Testimonial</title>
<link rel="stylesheet" href="brand.css">
<style>
.ad{background:var(--sand);display:flex;flex-direction:column;align-items:center;padding:56px 64px 52px}
.blob{position:absolute;border-radius:50%;background:var(--teal-soft);opacity:.35}
.b1{width:520px;height:520px;left:-200px;top:-180px}
.b2{width:420px;height:420px;right:-160px;bottom:-140px;background:var(--teal);opacity:.18}
.logo{position:relative;height:80px}
.card{position:relative;margin:36px 0 0;flex:1;width:100%;background:#fff;border-radius:36px;padding:70px 72px 56px;
  box-shadow:0 24px 50px rgba(19,41,75,.12);display:flex;flex-direction:column;justify-content:center}
.q{position:absolute;top:-58px;left:56px;font-family:"Caladea","Liberation Serif",serif;font-weight:700;font-size:250px;line-height:1;color:var(--teal);height:150px}
.stars{display:flex;gap:8px;margin-bottom:28px}
.stars svg{width:44px;height:44px}
blockquote{font-family:"Caladea","Liberation Serif",serif;font-size:62px;line-height:1.2;color:var(--navy)}
.who{display:flex;align-items:center;gap:18px;margin-top:48px;font-size:28px;font-weight:700}
.who .avatar{width:64px;height:64px;border-radius:50%;background:var(--mint);border:3px solid var(--teal-soft);display:grid;place-items:center;color:var(--teal);font-size:28px;font-weight:800}
.who small{display:block;font-size:20px;font-weight:500;color:#5A6B82;margin-top:2px}
.foot{position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:32px}
.offer{font-size:28px;font-weight:700}
.offer b{color:var(--teal)}
.cta{font-size:26px;padding:18px 32px}
@media (max-aspect-ratio:3/4){
  .ad{padding:230px 64px 330px}
  .logo{height:96px}
  .card{margin-top:60px;padding:110px 72px 64px}
  .q{font-size:330px;top:-80px}
  .stars svg{width:56px;height:56px}
  .stars{margin-bottom:40px}
  blockquote{font-size:76px}
  .who{margin-top:64px}
  .who{font-size:34px}
  .who .avatar{width:80px;height:80px;font-size:34px}
  .who small{font-size:24px}
  .foot{flex-direction:column;gap:26px;margin-top:48px}
  .offer{font-size:36px}
  .cta{font-size:34px;padding:24px 48px}
}
</style></head><body>
<div class="ad">
  <div class="blob b1"></div><div class="blob b2"></div>
  <img class="logo" src="logo.svg" alt="Shaperz Elite Wellness and Aesthetics">
  <div class="card">
    <div class="q">&ldquo;</div>
    <div class="stars" aria-label="5 stars">
      <svg viewBox="0 0 24 24"><path fill="#F2B53B" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg>
      <svg viewBox="0 0 24 24"><path fill="#F2B53B" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg>
      <svg viewBox="0 0 24 24"><path fill="#F2B53B" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg>
      <svg viewBox="0 0 24 24"><path fill="#F2B53B" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg>
      <svg viewBox="0 0 24 24"><path fill="#F2B53B" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg>
    </div>
    <blockquote>[Patient quote goes here — from a real Shaperz Google review]</blockquote>
    <div class="who"><div class="avatar">P</div><div>– [Patient Name], Chicago<small>Google review</small></div></div>
  </div>
  <div class="foot">
    <div class="offer">New patients: <b>$249 first month</b></div>
    <div class="cta">Book Now <span class="arrow">→</span></div>
  </div>
</div>
</body></html>
