<!doctype html><html><head><meta charset="utf-8"><title>Shaperz Ad 2 – $249 Offer</title>
<link rel="stylesheet" href="brand.css">
<style>
.ad{background:radial-gradient(circle at 85% 20%,#24477A 0,var(--navy) 55%);color:#fff;display:grid;grid-template-columns:1fr 430px;gap:24px;padding:60px 60px 56px 64px}
.ad::after{content:"";position:absolute;right:-180px;bottom:-220px;width:620px;height:620px;border-radius:50%;background:var(--teal);opacity:.22}
.copy{display:flex;flex-direction:column;position:relative;z-index:1}
.badge{align-self:flex-start;margin-top:40px;background:var(--gold);color:var(--navy);font-weight:800;font-size:24px;letter-spacing:2.5px;padding:14px 24px;border-radius:10px;transform:rotate(-3deg);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.price{font-family:var(--display);font-weight:900;font-size:210px;line-height:.9;letter-spacing:-6px;color:var(--teal-soft);margin-top:30px}
.price sup{font-size:.45em;vertical-align:.95em;letter-spacing:0;margin-right:6px}
.month{font-family:var(--display);font-weight:800;font-size:76px;line-height:1;letter-spacing:-1.5px;margin-top:6px}
.sub{font-size:28px;line-height:1.35;color:#D5E3F0;margin-top:22px;max-width:520px}
.cta{margin-top:40px;align-self:flex-start;background:var(--teal-soft);color:var(--navy);font-size:26px;padding:18px 32px}
.cta .arrow{color:var(--navy)}
.addr{margin-top:auto;font-size:20px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal-soft)}
.kit{position:relative;z-index:1;align-self:center;background:var(--sand);color:var(--navy);border-radius:28px;padding:64px 26px 26px;transform:rotate(2.5deg);box-shadow:0 30px 60px rgba(0,0,0,.35)}
.kit::before{content:"";position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:150px;height:52px;border-radius:14px;background:var(--teal);box-shadow:inset 0 -8px 0 rgba(0,0,0,.15)}
.kit h3{position:absolute;top:26px;left:0;right:0;text-align:center;font-size:17px;letter-spacing:3px;text-transform:uppercase;color:var(--teal);font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{background:#fff;border-radius:18px;padding:20px 10px 16px;text-align:center}
.tile svg{width:66px;height:66px;display:block;margin:0 auto 10px}
.tile span{font-size:17px;font-weight:700;line-height:1.15;display:block}
.logo{height:76px;align-self:flex-start;width:auto}
@media (max-aspect-ratio:3/4){
  .ad{display:flex;flex-direction:column;padding:230px 72px 0}
  .addr{display:none}
  .copy{display:contents}
  .logo{height:92px}
  .badge{font-size:30px;margin-top:56px}
  .price{font-size:250px;margin-top:36px}
  .month{font-size:104px}
  .sub{font-size:38px;max-width:none}
  .kit{align-self:center;width:900px;margin-top:52px;padding:80px 32px 32px;transform:rotate(-1.5deg)}
  .kit h3{font-size:24px;top:34px}
  .grid{grid-template-columns:1fr 1fr 1fr;gap:20px}
  .tile{padding:22px 10px 18px}
  .tile svg{width:80px;height:80px}
  .tile span{font-size:23px}
  .cta{order:9;font-size:36px;margin-top:52px;padding:26px 52px}
}
</style></head><body>
<div class="ad">
  <div class="copy">
    <img class="logo" src="logo-reversed.svg" alt="Shaperz Elite Wellness and Aesthetics">
    <div class="badge">NEW PATIENT SPECIAL</div>
    <div class="price"><sup>$</sup>249</div>
    <div class="month">First Month</div>
    <p class="sub">Medical weight loss program. Labs, 3D body scan, and meal plan included.</p>
    <div class="cta">Book Now <span class="arrow">→</span></div>
    <div class="addr">3135 W. 111th St · Chicago</div>
  </div>
  <div class="kit">
    <h3>Your first month</h3>
    <div class="grid">
      <div class="tile"><svg viewBox="0 0 64 64" fill="none" stroke="#13294B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 6h16M28 6v34a8 8 0 0 0 16 0V6"/><path d="M28 30h16v10a8 8 0 0 1-16 0z" fill="#7CCBC4" stroke="none"/><path d="M28 6v34a8 8 0 0 0 16 0V6"/></svg><span>Basic Labs</span></div>
      <div class="tile"><svg viewBox="0 0 64 64" fill="none" stroke="#13294B" stroke-width="4" stroke-linecap="round"><ellipse cx="32" cy="32" rx="26" ry="10"/><ellipse cx="32" cy="32" rx="10" ry="26" stroke="#2E8C86"/><circle cx="32" cy="32" r="5" fill="#F2B53B" stroke="none"/></svg><span>3D Body Scan</span></div>
      <div class="tile"><svg viewBox="0 0 64 64" fill="none" stroke="#13294B" stroke-width="4" stroke-linecap="round"><circle cx="34" cy="34" r="20"/><circle cx="34" cy="34" r="11" fill="#7CCBC4" stroke="none"/><path d="M8 10v14a4 4 0 0 0 4 4v26M16 10v14"/><path d="M58 10c-4 2-6 8-6 16h6v28"/></svg><span>Meal Plan</span></div>
      <div class="tile"><svg viewBox="0 0 64 64" fill="none" stroke="#13294B" stroke-width="4" stroke-linecap="round"><path d="M18 32h28"/><rect x="10" y="20" width="8" height="24" rx="3" fill="#7CCBC4"/><rect x="46" y="20" width="8" height="24" rx="3" fill="#7CCBC4"/><path d="M4 28v8M60 28v8"/></svg><span>Exercise Guidance</span></div>
      <div class="tile"><svg viewBox="0 0 64 64" fill="none" stroke="#13294B" stroke-width="4" stroke-linejoin="round"><path d="M32 10l16 9v18l-16 9-16-9V19z"/><circle cx="32" cy="10" r="5" fill="#F2B53B" stroke="none"/><circle cx="48" cy="37" r="5" fill="#2E8C86" stroke="none"/><circle cx="16" cy="37" r="5" fill="#7CCBC4" stroke="none"/><path d="M32 46v10"/></svg><span>Hormone Review</span></div>
      <div class="tile"><svg viewBox="0 0 64 64" fill="none" stroke="#13294B" stroke-width="4" stroke-linecap="round"><circle cx="32" cy="34" r="24"/><path d="M32 34V10a24 24 0 0 1 0 48z" fill="#7CCBC4" stroke="none" opacity=".6"/><circle cx="32" cy="34" r="24"/><path d="M32 20v14l9 6"/><path d="M26 4h12"/></svg><span>60-Min Visit</span></div>
    </div>
  </div>
</div>
</body></html>
